<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080c1a">
<title>لا يوجد اتصال - شحن برو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080c1a;
    --card: #111827;
    --border: rgba(255,255,255,0.07);
    --primary: #1e6fff;
    --cyan: #00d4ff;
    --text: #ffffff;
    --text2: #8fa3bf;
    --font: 'Cairo', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    direction: rtl;
    overflow: hidden;
  }

  /* Stars background */
  .stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.3); }
  }

  /* Main container */
  .container {
    position: relative;
    z-index: 1;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }

  /* Animated planet/wifi area */
  .illustration {
    width: 200px;
    height: 200px;
    position: relative;
    margin-bottom: 32px;
  }

  /* Orbit rings */
  .orbit {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(30,111,255,0.2);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .orbit-1 { width: 160px; height: 160px; animation: spin 8s linear infinite; }
  .orbit-2 { width: 120px; height: 120px; animation: spin 5s linear infinite reverse; }

  @keyframes spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* Dot on orbit */
  .orbit-1::after, .orbit-2::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
  }
  .orbit-1::after { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .orbit-2::after { background: var(--primary); box-shadow: 0 0 10px var(--primary); }

  /* Center icon */
  .center-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #0d1428, #1a2340);
    border: 1px solid rgba(30,111,255,0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(30,111,255,0.2);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(30,111,255,0.2); }
    50% { box-shadow: 0 0 40px rgba(30,111,255,0.5), 0 0 60px rgba(0,212,255,0.2); }
  }

  /* WiFi bars animation */
  .wifi-icon {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 3px;
  }

  .wifi-bar {
    height: 4px;
    border-radius: 2px;
    background: var(--text2);
    opacity: 0.3;
  }
  .wifi-bar:nth-child(1) { width: 8px; }
  .wifi-bar:nth-child(2) { width: 14px; }
  .wifi-bar:nth-child(3) { width: 20px; animation: blink 1.5s ease-in-out infinite 0.3s; }
  .wifi-bar:nth-child(4) { width: 26px; animation: blink 1.5s ease-in-out infinite 0.6s; }

  @keyframes blink {
    0%, 100% { opacity: 0.3; background: var(--text2); }
    50% { opacity: 1; background: var(--primary); }
  }

  /* Text content */
  .title {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .title span {
    background: linear-gradient(90deg, var(--primary), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
    margin-bottom: 36px;
    max-width: 300px;
  }

  /* Suggestions card */
  .suggestions {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    width: 100%;
    margin-bottom: 28px;
    text-align: right;
  }

  .suggestions-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .suggestion-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text2);
  }

  .suggestion-item:last-child { border-bottom: none; padding-bottom: 0; }
  .suggestion-item:first-of-type { padding-top: 0; }

  .suggestion-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  /* Retry button */
  .retry-btn {
    background: linear-gradient(135deg, var(--primary), #0d4fd4);
    border: none;
    border-radius: 14px;
    color: white;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    padding: 14px 40px;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
    box-shadow: 0 8px 24px rgba(30,111,255,0.35);
    -webkit-tap-highlight-color: transparent;
  }

  .retry-btn:active {
    transform: scale(0.97);
    box-shadow: 0 4px 12px rgba(30,111,255,0.25);
  }

  .retry-btn .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: rotate 0.8s linear infinite;
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  .retry-btn.loading .spinner { display: block; }
  .retry-btn.loading .btn-text { opacity: 0.7; }

  /* Status indicator */
  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 430px;
    margin: 0 auto;
    background: rgba(255,71,87,0.12);
    border-top: 1px solid rgba(255,71,87,0.25);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: #ff7b87;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff4757;
    animation: blink-dot 1.5s ease-in-out infinite;
  }

  @keyframes blink-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Online notification */
  .online-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #00c853, #00e676);
    color: white;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(0,200,83,0.4);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 9999;
    white-space: nowrap;
  }

  .online-toast.show {
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<!-- Online restored toast -->
<div class="online-toast" id="onlineToast">
  ✅ &nbsp; عاد الاتصال! يتم التحميل...
</div>

<!-- Main content -->
<div class="container">

  <!-- Illustration -->
  <div class="illustration">
    <div class="orbit orbit-1"></div>
    <div class="orbit orbit-2"></div>
    <div class="center-icon">
      <div class="wifi-icon">
        <div class="wifi-bar"></div>
        <div class="wifi-bar"></div>
        <div class="wifi-bar"></div>
        <div class="wifi-bar"></div>
      </div>
    </div>
  </div>

  <!-- Text -->
  <h1 class="title">لا يوجد <span>اتصال</span><br>بالإنترنت</h1>
  <p class="subtitle">
    يبدو أن جهازك غير متصل بالشبكة حالياً.<br>
    تحقق من اتصالك وحاول مجدداً.
  </p>

  <!-- Suggestions -->
  <div class="suggestions">
    <div class="suggestions-title">
      💡 ماذا تفعل؟
    </div>
    <div class="suggestion-item">
      <div class="suggestion-icon" style="background:rgba(30,111,255,0.15)">📶</div>
      تحقق من تفعيل البيانات الجوالة أو الواي فاي
    </div>
    <div class="suggestion-item">
      <div class="suggestion-icon" style="background:rgba(0,212,255,0.15)">✈️</div>
      تأكد من أن وضع الطيران غير مفعّل
    </div>
    <div class="suggestion-item">
      <div class="suggestion-icon" style="background:rgba(245,166,35,0.15)">🔄</div>
      أعد تشغيل الراوتر أو البيانات
    </div>
  </div>

  <!-- Retry button -->
  <button class="retry-btn" id="retryBtn" onclick="retryConnection()">
    <div class="spinner"></div>
    <span class="btn-text">🔄 &nbsp; إعادة المحاولة</span>
  </button>

</div>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-dot"></div>
  أنت غير متصل بالإنترنت الآن
</div>

<script>
// ── Generate stars ──
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  star.style.cssText = `
    width: ${size}px;
    height: ${size}px;
    top: ${Math.random() * 100}%;
    left: ${Math.random() * 100}%;
    --d: ${(Math.random() * 3 + 2).toFixed(1)}s;
    --delay: ${(Math.random() * 4).toFixed(1)}s;
  `;
  starsContainer.appendChild(star);
}

// ── Retry logic ──
function retryConnection() {
  const btn = document.getElementById('retryBtn');
  btn.classList.add('loading');
  btn.querySelector('.btn-text').textContent = 'جاري التحقق...';

  setTimeout(() => {
    if (navigator.onLine) {
      window.location.reload();
    } else {
      btn.classList.remove('loading');
      btn.querySelector('.btn-text').innerHTML = '🔄 &nbsp; إعادة المحاولة';
      // Shake effect
      btn.style.animation = 'shake 0.4s ease';
      setTimeout(() => btn.style.animation = '', 500);
    }
  }, 1800);
}

// ── Auto-detect when connection is restored ──
window.addEventListener('online', () => {
  const toast = document.getElementById('onlineToast');
  toast.classList.add('show');
  setTimeout(() => window.location.reload(), 1500);
});

// ── Shake animation ──
const styleEl = document.createElement('style');
styleEl.textContent = `
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-8px); }
    40%       { transform: translateX(8px); }
    60%       { transform: translateX(-5px); }
    80%       { transform: translateX(5px); }
  }
`;
document.head.appendChild(styleEl);
</script>
</body>
</html>
