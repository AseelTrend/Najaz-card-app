; ── Timezone: Saudi Arabia (UTC+3) ──
date.timezone = "Asia/Riyadh"

; ─────────────────────────────
; 🔒 إخفاء معلومات السيرفر
; ─────────────────────────────
expose_php = Off

; ─────────────────────────────
; 🛑 إدارة الأخطاء (مهم جداً)
; ─────────────────────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /tmp/php_errors.log

; ─────────────────────────────
; 📦 رفع الملفات
; ─────────────────────────────
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5

; ─────────────────────────────
; ⏱️ الأداء والحماية
; ─────────────────────────────
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

; ─────────────────────────────
; 🍪 حماية الجلسات (مهم جداً 🔥)
; ─────────────────────────────
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

session.use_strict_mode = 1
session.use_only_cookies = 1

; ─────────────────────────────
; 🔐 منع تنفيذ دوال خطيرة
; ─────────────────────────────
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,show_source

; ─────────────────────────────
; 🚫 حماية إضافية
; ─────────────────────────────
allow_url_fopen = Off
allow_url_include = Off

; ─────────────────────────────
; 📂 حماية المسارات
; ─────────────────────────────
open_basedir = /home/:/tmp/

; ─────────────────────────────
; 🔒 حماية من رفع ملفات خبيثة
; ─────────────────────────────
file_uploads = On

; ─────────────────────────────
; 🧠 OPcache (تحسين الأداء)
; ─────────────────────────────
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=4000
opcache.revalidate_freq=60